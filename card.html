<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIMAS KURNIAWAN - PREMIUM AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* RESET & GLOBAL SETTINGS */
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
      
      /* --- LOADING SCREEN --- */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 0.5s ease-out;
      }
      
      .brand-title {
        color: white; font-weight: 800; font-size: 28px; letter-spacing: 1px;
        margin-bottom: 5px; text-transform: uppercase;
        background: linear-gradient(90deg, #00f2ea, #ff0050);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      
      #start-btn {
        margin-top: 30px; padding: 16px 40px; 
        background: rgba(255, 255, 255, 0.05); 
        color: #00f2ea; border: 1px solid rgba(0, 242, 234, 0.5);
        border-radius: 50px; font-weight: 700; font-size: 14px; letter-spacing: 1px;
        cursor: pointer; transition: all 0.3s;
        box-shadow: 0 0 20px rgba(0, 242, 234, 0.2);
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #start-btn:hover { background: #00f2ea; color: black; box-shadow: 0 0 40px rgba(0, 242, 234, 0.6); }

      /* --- HUD MENU MEWAH (GLASSMORPHISM) --- */
      #hud-container {
        position: fixed; bottom: 0; left: 0; width: 100%;
        padding: 25px 20px 40px 20px;
        display: flex; flex-direction: column; align-items: center;
        z-index: 1000;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 30px 30px 0 0;
        box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        transform: translateY(120%);
        transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      }
      #hud-container.active { transform: translateY(0); }

      .profile-info {
        display: flex; align-items: center; width: 100%; margin-bottom: 25px;
        border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;
      }
      .avatar {
        width: 55px; height: 55px; border-radius: 50%; 
        background-image: url('https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450');
        background-size: cover; border: 2px solid #00f2ea; margin-right: 15px;
        box-shadow: 0 0 15px rgba(0, 242, 234, 0.3);
      }
      .text-details h3 { margin: 0; color: white; font-weight: 800; font-size: 20px; letter-spacing: 0.5px; }
      .text-details p { margin: 4px 0 0 0; color: #aaa; font-size: 13px; font-weight: 600; }

      .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
      
      .glass-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 16px; border-radius: 16px;
        text-decoration: none; color: white; font-weight: 700; font-size: 14px;
        transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
      }
      .wa { background: linear-gradient(135deg, rgba(37, 211, 102, 0.2), rgba(37, 211, 102, 0.05)); border-color: rgba(37, 211, 102, 0.3); }
      .wa i { color: #25D366; font-size: 18px; }
      .ig { background: linear-gradient(135deg, rgba(225, 48, 108, 0.2), rgba(225, 48, 108, 0.05)); border-color: rgba(225, 48, 108, 0.3); }
      .ig i { color: #E1306C; font-size: 18px; }
      .web { 
        grid-column: span 2; 
        background: linear-gradient(135deg, rgba(0, 242, 234, 0.2), rgba(0, 119, 181, 0.1));
        border-color: rgba(0, 242, 234, 0.3);
      }
      .web i { color: #00f2ea; font-size: 18px; }
      .glass-btn:active { transform: scale(0.97); opacity: 0.8; }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <div class="brand-title">DIMAS KURNIAWAN</div>
      <p style="color: #888; font-size: 12px; letter-spacing: 4px; font-weight: 600;">AUGMENTED REALITY SYSTEM</p>
      <button id="start-btn">INITIALIZE</button>
    </div>

    <div id="hud-container">
      <div class="profile-info">
        <div class="avatar"></div>
        <div class="text-details">
          <h3>Dimas Kurniawan</h3>
          <p>CEO & Founder GP69</p>
        </div>
      </div>
      <div class="btn-grid">
        <a href="https://wa.me/6281234567890" target="_blank" class="glass-btn wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <a href="https://instagram.com/dimaskurniawan" target="_blank" class="glass-btn ig"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="https://gp69.xyz" target="_blank" class="glass-btn web"><i class="fas fa-globe"></i> Buka Website</a>
      </div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">
            
            <a-circle src="#profile-img" radius="0.6" position="0 0.9 0" opacity="0.9"></a-circle>
            
            <a-ring radius-inner="0.65" radius-outer="0.68" color="#00f2ea" position="0 0.9 0"
                    animation="property: rotation; to: 0 0 -360; dur: 8000; easing: linear; loop: true"></a-ring>
            <a-ring radius-inner="0.75" radius-outer="0.77" color="#ff0050" position="0 0.9 0"
                    animation="property: scale; to: 1.05 1.05 1.05; dir: alternate; dur: 1500; loop: true"></a-ring>

            <a-text value="DIMAS KURNIAWAN" color="white" align="center" position="0 0 0" width="8" font="roboto"></a-text>
            <a-text value="CEO & FOUNDER GP69" color="#00f2ea" align="center" position="0 -0.3 0" width="4" font="roboto"></a-text>
            
            <a-entity position="0 -0.8 0" animation="property: position; to: 0 -1.0 0; dir: alternate; dur: 1000; loop: true">
                 <a-text value="v MENU DI BAWAH v" align="center" width="3" color="#aaa" font="roboto"></a-text>
            </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const hudContainer = document.getElementById('hud-container');
      const arTarget = document.getElementById('ar-target');

      startBtn.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.classList.add('hidden'); }, 500);
      });

      arTarget.addEventListener("mindar-image-targetFound", () => {
        console.log("Target Ketemu!");
        hudContainer.classList.add('active'); 
      });

      arTarget.addEventListener("mindar-image-targetLost", () => {
        console.log("Target Hilang!");
        hudContainer.classList.remove('active');
      });
    </script>
  </body>
</html>
