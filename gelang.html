<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GHOST DIAMOND</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background: black; }
      
      /* TOMBOL SNAP (TOMBOL UTAMA) */
      #snap-btn {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        width: 70px; height: 70px;
        background: white; border: 4px solid rgba(0,0,0,0.2);
        border-radius: 50%; cursor: pointer; z-index: 1000;
        box-shadow: 0 0 20px rgba(0,255,255,0.5);
      }
      #snap-btn:active { transform: translateX(-50%) scale(0.9); background: #ccc; }

      /* EFEK FLASH KAMERA */
      #flash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: white; opacity: 0; pointer-events: none; z-index: 9999;
      }
      .flash-anim { animation: flashEffect 0.2s ease-out; }
      @keyframes flashEffect { 
        0% { opacity: 0.8; } 
        100% { opacity: 0; } 
      }
    </style>
  </head>
  
  <body>
    <div id="flash"></div>

    <button id="snap-btn"></button>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true;"
             screenshot="width: 1080; height: 1920"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="diamond-model" src="./assets/models/diamond.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="2 4 2" intensity="3" color="white"></a-light>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity id="ghost-group" visible="false" position="0 0 0" scale="0.5 0.5 0.5">
            
            <a-gltf-model src="#diamond-model" 
                          rotation="0 0 0"
                          animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
            </a-gltf-model>

            <a-ring radius-inner="1.4" radius-outer="1.45" color="#00ffff" rotation="90 0 0"
                    material="emissive: #00ffff; emissiveIntensity: 2"></a-ring>

        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const snapBtn = document.getElementById('snap-btn');
      const ghostGroup = document.getElementById('ghost-group');
      const flashDiv = document.getElementById('flash');
      const scene = document.querySelector('a-scene');

      // FUNGSI SAKTI: MUNCUL -> FOTO -> ILANG
      snapBtn.addEventListener('click', () => {
        
        // 1. Munculin Hantu
        ghostGroup.setAttribute('visible', 'true');

        // 2. Efek Flash (Biar mata user silau dikit & gak sadar modelnya muncul)
        flashDiv.classList.add('flash-anim');
        setTimeout(() => flashDiv.classList.remove('flash-anim'), 500);

        // 3. Tunggu frame render sebentar (50ms) lalu CEKREK
        setTimeout(() => {
            // Ambil Screenshot (Download Otomatis)
            scene.components.screenshot.capture('perspective');
            
            // 4. Umpetin lagi LANGSUNG!
            // Kita kasih delay dikit banget biar kebawa di foto, tapi mata gak sempet fokus
            setTimeout(() => {
                ghostGroup.setAttribute('visible', 'false');
            }, 100); 
        }, 50);
      });
    </script>
  </body>
</html>
