<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIMAS KURNIAWAN - KING CARD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
      
      /* --- HUD MENU BAWAH (Tetap Ada Karena Gacor) --- */
      #hud-container {
        position: fixed; bottom: 0; left: 0; width: 100%;
        padding: 20px; z-index: 1000;
        display: flex; flex-direction: column; gap: 10px;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        transform: translateY(120%); transition: transform 0.5s;
      }
      #hud-container.active { transform: translateY(0); }

      .btn-gold {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 15px; border-radius: 10px;
        background: rgba(0, 0, 0, 0.8); border: 1px solid #FFD700;
        color: #FFD700; text-decoration: none; font-weight: bold;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
      }
      
      /* TOMBOL START */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
      }
      #start-btn {
        padding: 15px 40px; background: #FFD700; color: #000; font-weight: 900;
        border: none; border-radius: 5px; cursor: pointer; letter-spacing: 2px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h1 style="color: #FFD700; margin-bottom: 10px;">KING ACCESS</h1>
      <button id="start-btn">BUKA KARTU</button>
    </div>

    <div id="hud-container">
      <a href="https://wa.me/6281234567890" target="_blank" class="btn-gold">
        <i class="fab fa-whatsapp"></i> HUBUNGI SAYA
      </a>
      <a href="https://instagram.com/dimaskurniawan" target="_blank" class="btn-gold">
        <i class="fab fa-instagram"></i> INSTAGRAM
      </a>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.55 0.55 0.55">
            
            <a-plane color="#0a0a0a" width="2" height="3" position="0 0.2 0" opacity="0.95"></a-plane>
            <a-plane color="#FFD700" width="2.1" height="3.1" position="0 0.2 -0.01"></a-plane>

            <a-triangle color="#FFD700" vertex-a="0 0.5 0" vertex-b="-0.2 -0.2 0" vertex-c="0.2 -0.2 0" position="0 1.3 0.1"></a-triangle>
            <a-triangle color="#FFD700" vertex-a="0 0.4 0" vertex-b="-0.2 -0.2 0" vertex-c="0.2 -0.2 0" position="-0.25 1.25 0.1" rotation="0 0 -20"></a-triangle>
            <a-triangle color="#FFD700" vertex-a="0 0.4 0" vertex-b="-0.2 -0.2 0" vertex-c="0.2 -0.2 0" position="0.25 1.25 0.1" rotation="0 0 20"></a-triangle>

            <a-circle src="#profile-img" radius="0.6" position="0 0.5 0.1"></a-circle>
            <a-ring color="#FFD700" radius-inner="0.6" radius-outer="0.65" position="0 0.5 0.1"></a-ring>

            <a-text value="DIMAS KURNIAWAN" align="center" position="0 -0.4 0.1" width="6" 
                    color="#FFD700" font="roboto" negate="false"></a-text>
            <a-plane color="#FFD700" width="1.5" height="0.02" position="0 -0.6 0.1"></a-plane>
            <a-text value="CEO & FOUNDER GP69" align="center" position="0 -0.8 0.1" width="4" 
                    color="#FFFFFF" font="roboto" negate="false"></a-text>

            <a-plane color="#FFD700" width="0.1" height="0.1" position="-0.8 -0.4 0.1" rotation="0 0 45"></a-plane>
            <a-plane color="#FFD700" width="0.1" height="0.1" position="0.8 -0.4 0.1" rotation="0 0 45"></a-plane>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const hudContainer = document.getElementById('hud-container');
      const arTarget = document.getElementById('ar-target');

      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });

      // Menu Muncul Pas Target Ketemu
      arTarget.addEventListener("mindar-image-targetFound", () => {
        hudContainer.classList.add('active');
      });
      arTarget.addEventListener("mindar-image-targetLost", () => {
        hudContainer.classList.remove('active');
      });
    </script>
  </body>
</html>
