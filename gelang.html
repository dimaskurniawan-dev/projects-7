<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REAL DIAMOND AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('apply-realism', {
        init: function () {
          // Kita ambil gambar langit (env map)
          const scene = this.el.sceneEl.object3D;
          const loader = new THREE.TextureLoader();
          
          // Gambar Studio Lighting (Biar kinclong kayak foto studio)
          const envTexture = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/2294472375_24a3b8ef46_o.jpg');
          envTexture.mapping = THREE.EquirectangularReflectionMapping;

          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            mesh.traverse((node) => {
              if (node.isMesh) {
                // 1. TEMPEL REFLEKSI
                node.material.envMap = envTexture;
                node.material.envMapIntensity = 2.0; // Makin tinggi makin silau
                node.material.needsUpdate = true;
                
                // 2. KOREKSI MATERIAL (Biar gak plastik)
                // Kalau model aslinya udah bagus, ini opsional. 
                // Tapi biar aman kita set jadi KACA/LOGAM
                node.material.metalness = 1.0;  // Wajib 1 buat berlian
                node.material.roughness = 0.0;  // Wajib 0 biar licin
                node.material.color.setHex(0xffffff); // Warna dasar putih (biar nerima refleksi)
              }
            });
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; background: black; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 999;
      }
      #start-btn {
        padding: 12px 30px; background: white; border: none;
        color: black; font-weight: bold; border-radius: 5px; cursor: pointer;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h1 style="color: white; font-family: sans-serif;">ORIGINAL QUALITY</h1>
      <button id="start-btn">LIHAT BARANG</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2; toneMapping: ACESFilmic;"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="diamond-model" src="./assets/models/diamond.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="2 4 2" intensity="3" color="white"></a-light>
      <a-light type="directional" position="-2 -4 2" intensity="1" color="#ccffff"></a-light>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">
            <a-gltf-model src="#diamond-model" 
                          apply-realism 
                          position="0 0 0" 
                          rotation="0 0 0"
                          animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      startBtn.addEventListener('click', () => { overlay.classList.add('hidden'); });
    </script>
  </body>
</html>
