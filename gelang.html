<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLUE ICE DIAMOND BRACELET</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background: black; }
      
      /* OVERLAY Loading yang keren */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #001f3f, #000000);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 999; transition: opacity 0.5s;
      }
      .title-text {
        color: #00ffff; font-family: sans-serif; font-weight: 800; 
        font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 10px #00ffff;
      }
      #start-btn {
        margin-top: 20px; padding: 12px 30px; background: transparent;
        border: 2px solid #00ffff; color: #00ffff; font-weight: bold;
        border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      }
      .hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <div class="title-text">FROST LINK ACTIVATED</div>
      <p style="color: #aaa; font-family: sans-serif;">Scan Your Bracelet</p>
      <button id="start-btn">START</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
             color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="env-map" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/equirectangular_cyber.jpg?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="0.1"></a-light>
      <a-light type="spot" position="0 2 0" rotation="-90 0 0" intensity="3" color="#00ffff" angle="45" penumbra="0.5" target="#diamond-center"></a-light>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.3 0.3 0.3">

            <a-entity id="diamond-center" position="0 0.5 0" 
                      animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
                
                <a-octahedron radius="1" detail="2"
                    material="shader: standard; 
                              color: #8AFFFF; 
                              metalness: 1.0; 
                              roughness: 0.05; 
                              opacity: 0.85; 
                              transparent: true; 
                              envMap: #env-map;
                              emissive: #00ffff;
                              emissiveIntensity: 0.2;">
                </a-octahedron>
                
                <a-octahedron radius="0.7" detail="0"
                    material="shader: flat; color: #00ffff; opacity: 0.4; transparent: true; blending: additive">
                </a-octahedron>

                <a-light type="point" color="#00ffff" intensity="2" distance="3"></a-light>
            </a-entity>

            <a-entity position="0 0.5 0" id="sparkle-container"></a-entity>

            <a-ring radius-inner="1.1" radius-outer="1.2" color="#00ffff" rotation="-90 0 0" position="0 0 0"
                    material="emissive: #00ffff; emissiveIntensity: 1"
                    animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true"></a-ring>
             <a-ring radius-inner="0.1" radius-outer="1.1" color="#00ffff" rotation="-90 0 0" position="0 -0.05 0" opacity="0.3"
                    material="emissive: #00ffff; emissiveIntensity: 0.5"></a-ring>

        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      
      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });

      // GENERATOR PARTIKEL KINCLONG
      const sparkleContainer = document.getElementById('sparkle-container');
      for(let i=0; i<20; i++) {
        let sparkle = document.createElement('a-plane');
        let x = (Math.random() - 0.5) * 2.5;
        let y = (Math.random() - 0.5) * 2.5;
        let z = (Math.random() - 0.5) * 2.5;
        let scale = 0.05 + Math.random() * 0.1;

        sparkle.setAttribute('position', `${x} ${y} ${z}`);
        sparkle.setAttribute('scale', `${scale} ${scale} ${scale}`);
        sparkle.setAttribute('material', 'shader: flat; color: #ffffff; transparent: true; opacity: 0.8; blending: additive');
        // Animasi kedap kedip
        sparkle.setAttribute('animation__fade', `property: material.opacity; from: 0.8; to: 0; dir: alternate; dur: ${500 + Math.random()*1000}; loop: true`);
        // Animasi muter pelan
        sparkle.setAttribute('animation__rot', `property: rotation; to: 0 360 0; dur: ${2000 + Math.random()*3000}; loop: true`);
        sparkleContainer.appendChild(sparkle);
      }
    </script>
  </body>
</html>
