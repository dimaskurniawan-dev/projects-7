<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIMAS KURNIAWAN - AR CARD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* RESET & FONT GLOBAL */
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
      
      /* --- LAYAR PEMBUKA (SPLASH SCREEN) --- */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
        transition: opacity 0.5s ease-out;
      }
      
      .loader-text {
        color: white; font-weight: 800; font-size: 24px; letter-spacing: 2px;
        margin-bottom: 5px; text-transform: uppercase;
        background: linear-gradient(90deg, #00f2ea, #ff0050);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      
      #start-btn {
        margin-top: 30px; padding: 16px 40px; 
        background: rgba(255, 255, 255, 0.1); 
        color: #00f2ea; border: 1px solid #00f2ea;
        border-radius: 50px; font-weight: 700; font-size: 14px;
        cursor: pointer; transition: all 0.3s;
        box-shadow: 0 0 15px rgba(0, 242, 234, 0.2);
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #start-btn:hover { background: #00f2ea; color: black; box-shadow: 0 0 30px rgba(0, 242, 234, 0.6); }

      /* --- HUD MENU MEWAH (GLASSMORPHISM) --- */
      #hud-container {
        position: fixed; bottom: 0; left: 0; width: 100%;
        padding: 20px 20px 40px 20px;
        display: flex; flex-direction: column; align-items: center;
        z-index: 1000;
        
        /* Efek Kaca Buram Dark Mode */
        background: rgba(10, 10, 10, 0.75);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        
        /* Animasi Slide Up */
        transform: translateY(120%);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Kalau target ketemu, tambah class ini biar muncul */
      #hud-container.active { transform: translateY(0); }

      .profile-header {
        display: flex; align-items: center; width: 100%; margin-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
      }
      
      .avatar-small {
        width: 50px; height: 50px; border-radius: 50%; 
        background-image: url('https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450');
        background-size: cover; border: 2px solid #00f2ea; margin-right: 15px;
      }
      
      .info-text h3 { margin: 0; color: white; font-weight: 800; font-size: 18px; }
      .info-text p { margin: 0; color: #aaa; font-size: 12px; font-weight: 600; }

      /* Tombol-tombol Keren */
      .action-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;
      }
      
      .btn-glass {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 14px; border-radius: 12px;
        text-decoration: none; color: white; font-weight: 600; font-size: 14px;
        transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
      }
      
      /* Warna Spesifik per Tombol */
      .btn-wa { background: linear-gradient(135deg, rgba(37, 211, 102, 0.2), rgba(37, 211, 102, 0.05)); }
      .btn-wa:active { background: rgba(37, 211, 102, 0.4); transform: scale(0.98); }
      .btn-wa i { color: #25D366; font-size: 18px; }

      .btn-ig { background: linear-gradient(135deg, rgba(193, 53, 132, 0.2), rgba(193, 53, 132, 0.05)); }
      .btn-ig:active { background: rgba(193, 53, 132, 0.4); transform: scale(0.98); }
      .btn-ig i { color: #E1306C; font-size: 18px; }

      .btn-web { 
        grid-column: span 2; /* Full width */
        background: linear-gradient(135deg, rgba(0, 242, 234, 0.2), rgba(0, 119, 181, 0.1));
        border: 1px solid rgba(0, 242, 234, 0.3);
      }
      .btn-web:active { opacity: 0.8; transform: scale(0.98); }
      .btn-web i { color: #00f2ea; }

      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <div class="loader-text">DIMAS KURNIAWAN</div>
      <p style="color: #666; font-size: 12px; letter-spacing: 3px;">AUGMENTED REALITY PORTFOLIO</p>
      <button id="start-btn">ACTIVATE SYSTEM</button>
    </div>

    <div id="hud-container">
      <div class="profile-header">
        <div class="avatar-small"></div> <div class="info-text">
          <h3>Dimas Kurniawan</h3>
          <p>Creative Developer & AR Creator</p>
        </div>
      </div>
      
      <div class="action-grid">
        <a href="https://wa.me/6281234567890" target="_blank" class="btn-glass btn-wa">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://instagram.com/dimaskurniawan" target="_blank" class="btn-glass btn-ig">
          <i class="fab fa-instagram"></i> Instagram
        </a>
        <a href="https://gp69.xyz" target="_blank" class="btn-glass btn-web">
          <i class="fas fa-globe"></i> Buka Website Portfolio
        </a>
      </div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">
            
            <a-circle src="#profile-img" radius="0.6" position="0 0.8 0" opacity="0.9"></a-circle>
            
            <a-ring radius-inner="0.65" radius-outer="0.68" color="#00f2ea" position="0 0.8 0"
                    animation="property: rotation; to: 0 0 -360; dur: 6000; easing: linear; loop: true"></a-ring>
            <a-ring radius-inner="0.75" radius-outer="0.76" color="#ff0050" position="0 0.8 0"
                    animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true"></a-ring>

            <a-text value="DIMAS KURNIAWAN" color="white" align="center" position="0 -0.1 0" width="8"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" shader="msdf"></a-text>
            
            <a-plane color="#000" opacity="0.6" width="2" height="0.4" position="0 -0.5 0"></a-plane>
            <a-text value="SYSTEM ONLINE // TAP MENU BELOW" color="#00f2ea" align="center" position="0 -0.5 0" width="3"></a-text>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const hudContainer = document.getElementById('hud-container');
      const arTarget = document.getElementById('ar-target');

      // 1. Masuk AR
      startBtn.addEventListener('click', () => {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.classList.add('hidden'); }, 500);
      });

      // 2. Logika Target Found (Slide Up Menu)
      arTarget.addEventListener("mindar-image-targetFound", () => {
        console.log("Target Bunga Ditemukan!");
        hudContainer.classList.add('active'); // Memicu animasi CSS slide-up
      });

      // 3. Logika Target Lost (Slide Down Menu)
      arTarget.addEventListener("mindar-image-targetLost", () => {
        console.log("Target Hilang!");
        hudContainer.classList.remove('active'); // Menu turun lagi
      });
    </script>
  </body>
</html>
