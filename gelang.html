<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CYBER DIAMOND BRACELET</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background: black; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 999;
      }
      #start-btn {
        padding: 12px 30px; background: #00ffff; color: black; font-weight: 800;
        border: none; border-radius: 30px; cursor: pointer;
        box-shadow: 0 0 20px #00ffff;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h1 style="color: #00ffff; font-family: sans-serif; text-shadow: 0 0 10px #00ffff;">SYSTEM LINK</h1>
      <button id="start-btn">ACTIVATE</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, sortObjects: true"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.35 0.35 0.35">

            <a-sphere radius="0.3" color="#ffffff"
                      material="shader: flat; opacity: 0.8; color: #ffffff"
                      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 500; loop: true">
            </a-sphere>
            <a-light type="point" color="#00ffff" intensity="4" distance="5" decay="2"></a-light>

            <a-icosahedron radius="1" detail="0"
                material="shader: standard; color: #00ffff; wireframe: true; emissive: #00ffff; emissiveIntensity: 2"
                animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
            </a-icosahedron>

            <a-icosahedron radius="0.95" detail="0"
                material="shader: standard; color: #00ffff; opacity: 0.3; metalness: 0.5; roughness: 0; side: double"
                animation="property: rotation; to: 360 0 0; dur: 15000; easing: linear; loop: true">
            </a-icosahedron>

            <a-ring radius-inner="1.4" radius-outer="1.45" color="#00ffff" rotation="90 0 0"
                    material="shader: flat; opacity: 0.5; side: double"
                    animation="property: rotation; to: 90 360 0; dur: 4000; easing: linear; loop: true">
            </a-ring>
            
             <a-ring radius-inner="1.6" radius-outer="1.62" color="#00ffff" rotation="45 0 0"
                    material="shader: flat; opacity: 0.3; side: double"
                    animation="property: rotation; to: 45 0 360; dur: 5000; easing: linear; loop: true">
            </a-ring>

        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      startBtn.addEventListener('click', () => { overlay.classList.add('hidden'); });
    </script>
  </body>
</html>
