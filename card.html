<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GP69 SMART CARD</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 999;
        display: flex; justify-content: center; align-items: center; flexDirection: column;
      }
      #start-btn {
        padding: 15px 30px; background: #00ffff; color: black; font-weight: bold;
        border: none; border-radius: 5px; cursor: pointer;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h2 style="color: white; margin-bottom: 10px;">GP69 CONNECT</h2>
      <button id="start-btn">SCAN KARTU NAMA</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable">
      </a-camera>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="point" position="0 2 2" intensity="1"></a-light>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">

            <a-circle src="#profile-img" radius="0.6" position="0 1 0" 
                      animation="property: position; to: 0 1.1 0; dir: alternate; dur: 2000; loop: true">
                <a-ring radius-inner="0.62" radius-outer="0.65" color="#00ffff"></a-ring>
            </a-circle>

            <a-text value="NAMA ABANG" color="white" align="center" position="0 0.2 0" width="8"></a-text>
            <a-text value="CEO & FOUNDER GP69" color="#00ffff" align="center" position="0 -0.1 0" width="5"></a-text>

            <a-entity id="btn-wa" class="clickable" position="-0.8 -0.8 0.1">
                <a-plane color="#25D366" width="1.5" height="0.5" opacity="0.9"></a-plane>
                <a-text value="WHATSAPP" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

            <a-entity id="btn-ig" class="clickable" position="0.8 -0.8 0.1">
                <a-plane color="#C13584" width="1.5" height="0.5" opacity="0.9"></a-plane>
                <a-text value="INSTAGRAM" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

            <a-entity id="btn-web" class="clickable" position="0 -1.5 0.1">
                <a-plane color="#0077b5" width="3.1" height="0.5" opacity="0.9"></a-plane>
                <a-text value="BUKA WEBSITE" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');

      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });

      // --- LOGIC KLIK TOMBOL (BAGIAN PENTING) ---
      
      // 1. Tombol WhatsApp
      document.querySelector('#btn-wa').addEventListener("click", function (evt) {
        console.log("WA Clicked");
        // GANTI NOMOR DI SINI (Pake 62, jangan 08)
        window.open("https://wa.me/6281234567890?text=Halo%20Bang%20Saya%20Lihat%20Kartu%20Nama%20AR", "_blank");
      });

      // 2. Tombol Instagram
      document.querySelector('#btn-ig').addEventListener("click", function (evt) {
        console.log("IG Clicked");
        // GANTI USERNAME DI SINI
        window.open("https://instagram.com/usernameabang", "_blank");
      });

      // 3. Tombol Website
      document.querySelector('#btn-web').addEventListener("click", function (evt) {
        console.log("Web Clicked");
        // GANTI WEBSITE DI SINI
        window.open("https://gp69.xyz", "_blank");
      });

    </script>
  </body>
</html>
