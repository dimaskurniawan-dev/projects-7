<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GP69 SMART CARD</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // Komponen pembuka link (Universal)
      AFRAME.registerComponent('buka-link', {
        schema: {
          url: {type: 'string', default: ''}
        },
        init: function () {
          var data = this.data;
          var el = this.el;

          // Saat diklik/disentuh
          el.addEventListener('click', function () {
            console.log("Tombol diklik: " + data.url);
            
            // Animasi visual biar user tau tombol kepencet (Scale down dikit)
            el.setAttribute('scale', '0.9 0.9 0.9');
            setTimeout(() => { el.setAttribute('scale', '1 1 1'); }, 200);

            // Buka Link (Jeda dikit biar animasi jalan dulu)
            setTimeout(() => {
                window.location.href = data.url;
            }, 300);
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
      }
      #start-btn {
        padding: 15px 30px; background: #00ffff; color: black; font-weight: bold;
        border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;
        z-index: 1000; /* Pastikan tombol start di atas segalanya */
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h2 style="color: white;">GP69 CONNECT</h2>
      <button id="start-btn">SCAN KARTU NAMA</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" 
                cursor="fuse: false; rayOrigin: mouse;" 
                raycaster="far: 10000; objects: .clickable">
      </a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">

            <a-circle src="#profile-img" radius="0.6" position="0 1 0"></a-circle>
            <a-text value="NAMA ABANG" color="white" align="center" position="0 0.2 0" width="8"></a-text>
            <a-text value="CEO GP69" color="#00ffff" align="center" position="0 -0.1 0" width="5"></a-text>

            <a-entity position="-0.8 -0.8 0.1">
                <a-plane class="clickable" color="#25D366" width="1.5" height="0.5"
                         buka-link="url: https://wa.me/6281234567890">
                </a-plane>
                <a-text value="WHATSAPP" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

            <a-entity position="0.8 -0.8 0.1">
                <a-plane class="clickable" color="#C13584" width="1.5" height="0.5"
                         buka-link="url: https://instagram.com/usernameabang">
                </a-plane>
                <a-text value="INSTAGRAM" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

            <a-entity position="0 -1.5 0.1">
                <a-plane class="clickable" color="#0077b5" width="3.1" height="0.5"
                         buka-link="url: https://gp69.xyz">
                </a-plane>
                <a-text value="BUKA WEBSITE" align="center" position="0 0 0.05" width="4" color="white"></a-text>
            </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });
    </script>
  </body>
</html>
