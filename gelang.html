<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOLOGRAM DIAMOND</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('make-hologram', {
        init: function () {
          this.el.addEventListener('model-loaded', e => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            mesh.traverse(node => {
              if (node.isMesh) {
                // KITA GANTI KULITNYA JADI CAHAYA MURNI
                // MeshBasicMaterial = Gak butuh lampu, dia nyala sendiri
                node.material = new THREE.MeshBasicMaterial({
                  color: 0x00ffff,   // WARNA CYAN (Ganti sesuka hati)
                  transparent: true, // Tembus pandang dikit
                  opacity: 0.8,      // Tingkat kepekatan (0.0 - 1.0)
                  side: THREE.DoubleSide, // Kelihatan dari luar & dalam
                  blending: THREE.AdditiveBlending, // EFEK LASER/GLOWING (PENTING!)
                  depthWrite: false  // Biar gak numpuk aneh
                });
              }
            });
          });
        }
      });
    </script>
    
    <style>
      body { margin: 0; overflow: hidden; background: black; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 999;
      }
      #start-btn {
        padding: 12px 30px; background: #00ffff; border: none;
        color: black; font-weight: 900; border-radius: 50px; cursor: pointer;
        box-shadow: 0 0 25px #00ffff; font-family: sans-serif; letter-spacing: 2px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h1 style="color: white; font-family: sans-serif; margin-bottom: 5px;">HOLO-MODE</h1>
      <button id="start-btn">SCAN SEKARANG</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true; sortObjects: true;"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="diamond-model" src="./assets/models/diamond.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.3 0.3 0.3">

            <a-gltf-model src="#diamond-model" 
                          make-hologram 
                          rotation="0 0 0" position="0 0.5 0" scale="1 1 1"
                          animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
            </a-gltf-model>

            <a-sphere radius="0.5" color="white" position="0 0.5 0"
                      material="shader: flat; opacity: 0.9"
                      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 500; loop: true">
            </a-sphere>

            <a-ring radius-inner="1.5" radius-outer="1.55" color="#00ffff" rotation="-90 0 0" position="0 0 0"
                    material="shader: flat; transparent: true; opacity: 0.5; blending: additive"
                    animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true"></a-ring>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      startBtn.addEventListener('click', () => { overlay.classList.add('hidden'); });
    </script>
  </body>
</html>
