<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GP69 LOVE LINK - PREMIUM</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* UI START - TEMA PREMIUM */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #2a0000 0%, #000000 100%);
        z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
      }
      
      #start-btn {
        padding: 15px 40px; font-size: 18px; font-weight: bold;
        background: #ff0055; color: white; border: none; border-radius: 4px;
        cursor: pointer; box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
        text-transform: uppercase; letter-spacing: 2px;
      }

      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <h1 style="color: white; letter-spacing: 3px; margin-bottom: 5px;">PESAN RAHASIA</h1>
      <p style="color: #ff0055; margin-bottom: 30px;">[ ENKRIPSI CINTA AKTIF ]</p>
      <button id="start-btn">BUKA SEKARANG</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" 
             renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="model-hati" src="./assets/models/hati.glb"></a-asset-item>
        <audio id="lagu-bucin" src="./assets/audio/halo.mp3" preload="auto"></audio>
      </a-assets>

      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="point" position="2 4 4" intensity="1.5" color="#ff0055"></a-light>
      <a-light type="point" position="-2 4 -4" intensity="1.5" color="#00ffff"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.4 0.4 0.4">
            
            <a-entity gltf-model="#model-hati" 
                      animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true"
                      animation__pulse="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true"
                      animation-mixer> </a-entity>

            <a-torus radius="1.4" radius-tubular="0.01" color="#ff0055" 
                     material="emissive: #ff0055; emissiveIntensity: 3"
                     rotation="90 0 0"
                     animation="property: rotation; to: 450 0 0; dur: 4000; loop: true">
            </a-torus>

            <a-text value="I LOVE YOU" align="center" position="0 1.8 0" width="10" 
                    color="#ffffff" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
                    animation="property: position; to: 0 2.0 0; dir: alternate; dur: 1500; loop: true">
            </a-text>

        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const arTarget = document.getElementById('ar-target');
      const audio = document.getElementById('lagu-bucin');

      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
        // Pancing audio
        audio.play().then(() => { audio.pause(); audio.currentTime = 0; });
      });

      // Muncul Suara pas Marker Kelihatan
      arTarget.addEventListener("mindar-image-targetFound", () => { audio.play(); });
      // Mati pas Kamera Digeser
      arTarget.addEventListener("mindar-image-targetLost", () => { audio.pause(); audio.currentTime = 0; });
    </script>
  </body>
</html>
