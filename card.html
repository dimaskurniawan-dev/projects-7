<!DOCTYPE html>
<html lang="id">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kartu Nama AR - Dimas</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* --- MENU TOMBOL BAWAH (HTML BIASA - PASTI BISA DIKLIK) --- */
      #hud-menu {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 400px;
        display: none; /* Sembunyi dulu */
        flex-direction: column; gap: 10px;
        z-index: 1000;
      }

      .btn {
        display: block; text-align: center;
        padding: 12px; border-radius: 8px;
        color: white; font-weight: bold; text-decoration: none;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      }
      
      /* Warna Tombol Standar */
      .btn-wa { background-color: #25D366; }
      .btn-ig { background-color: #E1306C; }
      .btn-web { background-color: #0077b5; }

      /* Layar Start */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: black; z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      #start-btn {
        padding: 15px 30px; background: white; color: black; font-weight: bold;
        border: none; border-radius: 5px; cursor: pointer;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  
  <body>
    <div id="overlay">
      <button id="start-btn">MULAI SCAN</button>
    </div>

    <div id="hud-menu">
      <a href="https://wa.me/6281234567890" target="_blank" class="btn btn-wa">WHATSAPP</a>
      <a href="https://instagram.com/dimaskurniawan" target="_blank" class="btn btn-ig">INSTAGRAM</a>
      <a href="https://gp69.xyz" target="_blank" class="btn btn-web">WEBSITE</a>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/bunga.mind;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="profile-img" src="https://cdn.glitch.global/d2966571-3836-4109-9407-395a89601689/profile_placeholder.png?v=1664899253450" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0" scale="0.5 0.5 0.5">
            
            <a-plane color="#111111" width="2" height="3" position="0 0 0" opacity="0.9"></a-plane>
            
            <a-circle src="#profile-img" radius="0.6" position="0 0.6 0.1"></a-circle>
            <a-ring color="white" radius-inner="0.6" radius-outer="0.65" position="0 0.6 0.1"></a-ring>

            <a-text value="DIMAS KURNIAWAN" align="center" position="0 -0.4 0.1" width="6" color="white"></a-text>
            <a-text value="CEO GP69" align="center" position="0 -0.7 0.1" width="4" color="#00ffff"></a-text>

            <a-text value="(KLIK TOMBOL DI BAWAH)" align="center" position="0 -1.2 0.1" width="3" color="#aaaaaa"></a-text>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById('start-btn');
      const overlay = document.getElementById('overlay');
      const hudMenu = document.getElementById('hud-menu');
      const arTarget = document.getElementById('ar-target');

      startBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });

      // Target Ketemu = Muncul Tombol
      arTarget.addEventListener("mindar-image-targetFound", () => {
        hudMenu.style.display = 'flex';
      });

      // Target Hilang = Tombol Hilang
      arTarget.addEventListener("mindar-image-targetLost", () => {
        hudMenu.style.display = 'none';
      });
    </script>
  </body>
</html>
